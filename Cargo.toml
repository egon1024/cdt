[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
clap = { version = "4.6", features = ["derive"] }
directories = "5.0"
hickory-proto = { version = "0.26", default-features = false, features = ["std"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
time = { version = "0.3", features = ["formatting", "parsing", "serde", "macros"] }
serde_yaml = "0.9"
ulid = "1.1"

[profile.release]
lto = true
codegen-units = 1
