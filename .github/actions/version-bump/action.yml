name: Version bump
description: Compute next semver from latest GitHub release and PR description directives

inputs:
  pr_body:
    description: Pull request description text for bundle and component semver directives
    required: false
    default: ""
  default_bump:
    description: Bundle bump level when no directive line is present
    required: false
    default: minor
  changed_files:
    description: Newline-separated paths changed in the PR (for component auto-bumps)
    required: false
    default: ""

outputs:
  current_version:
    description: Current bundle version (alias for current_bundle_version)
    value: ${{ steps.bump.outputs.current_version }}
  next_version:
    description: Next bundle version (alias for next_bundle_version)
    value: ${{ steps.bump.outputs.next_version }}
  current_bundle_version:
    description: Current CDT bundle version
    value: ${{ steps.bump.outputs.current_bundle_version }}
  next_bundle_version:
    description: Next CDT bundle version after applying the bump
    value: ${{ steps.bump.outputs.next_bundle_version }}
  component_versions:
    description: JSON map of utility name to version after merge
    value: ${{ steps.bump.outputs.component_versions }}
  bump_level:
    description: Bundle bump level — major, minor, or patch
    value: ${{ steps.bump.outputs.bump_level }}
  bump_source:
    description: explicit or implicit
    value: ${{ steps.bump.outputs.bump_source }}
  error:
    description: Error code when validation fails
    value: ${{ steps.bump.outputs.error }}

runs:
  using: composite
  steps:
    - id: bump
      shell: bash
      run: bash "${{ github.action_path }}/version-bump.sh"
      env:
        PR_BODY: ${{ inputs.pr_body }}
        DEFAULT_BUMP: ${{ inputs.default_bump }}
        CHANGED_FILES: ${{ inputs.changed_files }}
        GH_TOKEN: ${{ github.token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
