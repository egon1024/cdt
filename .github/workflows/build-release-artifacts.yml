# Build and upload GitHub release assets for an existing cdt-v* tag.
# Invoked from release.yml (workflow_call) or manually (workflow_dispatch).

name: Build release artifacts

on:
  workflow_call:
    inputs:
      version:
        description: Bundle semver to build (e.g. 0.1.0)
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Bundle semver to build (e.g. 0.1.0). Must match an existing cdt-v* tag
          and GitHub release.
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: release-artifacts-${{ inputs.version }}
  cancel-in-progress: false

env:
  RELEASE_VERSION: ${{ inputs.version }}
  RELEASE_TAG: cdt-v${{ inputs.version }}

jobs:
  build:
    name: Build and upload (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            rpm_arch: x86_64
            runner: ubuntu-22.04
            generate_sbom: "1"
          - arch: arm64
            rpm_arch: aarch64
            runner: ubuntu-24.04-arm
            generate_sbom: "0"
    steps:
      - name: Validate version
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must be MAJOR.MINOR.PATCH (got: ${RELEASE_VERSION})"
            exit 1
          fi

      - name: Checkout tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Sync release build scripts from main
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git checkout origin/main -- \
            .github/scripts/build-release-artifacts.sh \
            .github/scripts/render-nfpm-config.py \
            .github/scripts/verify-release-artifacts.sh \
            .github/scripts/check-release-assets-complete.sh \
            .github/scripts/release-asset-names.sh \
            .github/scripts/merge-release-sha256sums.sh \
            .github/scripts/cdt-versions.py
          chmod +x .github/scripts/*.sh

      - name: Verify tag exists
        run: |
          set -euo pipefail
          git rev-parse "refs/tags/${RELEASE_TAG}^{commit}" >/dev/null

      - name: Fail if release assets already exist for this arch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "::error::GitHub release ${RELEASE_TAG} does not exist yet"
            exit 1
          fi
          # shellcheck source=.github/scripts/release-asset-names.sh
          source .github/scripts/release-asset-names.sh
          mapfile -t expected < <(release_arch_asset_names "${RELEASE_VERSION}" "${{ matrix.arch }}")
          if [[ "${{ matrix.generate_sbom }}" == "1" ]]; then
            expected+=("cdt-${RELEASE_VERSION}.spdx.json")
          fi
          existing="$(gh release view "${RELEASE_TAG}" --json assets --jq '.assets[].name' || true)"
          for name in "${expected[@]}"; do
            if echo "${existing}" | grep -qx "${name}"; then
              echo "::error::Release asset already exists: ${name}. Delete it before rebuilding."
              exit 1
            fi
          done

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install tomli

      - name: Install nfpm
        run: |
          set -euo pipefail
          NFPM_VERSION=2.41.2
          case "${{ matrix.arch }}" in
            amd64) nfpm_deb="nfpm_${NFPM_VERSION}_amd64.deb" ;;
            arm64) nfpm_deb="nfpm_${NFPM_VERSION}_arm64.deb" ;;
            *) echo "::error::Unknown matrix arch"; exit 1 ;;
          esac
          curl -sL "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/${nfpm_deb}" -o /tmp/nfpm.deb
          sudo dpkg -i /tmp/nfpm.deb

      - name: Install cargo-cyclonedx
        if: matrix.generate_sbom == '1'
        run: cargo install cargo-cyclonedx --locked

      - name: Build release artifacts
        env:
          VERSION: ${{ env.RELEASE_VERSION }}
          ARCH: ${{ matrix.arch }}
          RPM_ARCH: ${{ matrix.rpm_arch }}
          GENERATE_SBOM: ${{ matrix.generate_sbom }}
          SKIP_SHA256SUMS: "1"
        run: bash .github/scripts/build-release-artifacts.sh

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "${RELEASE_TAG}" release-artifacts/*

  merge-sha256sums:
    name: Merge SHA256SUMS
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1

      - name: Sync merge script from main
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git checkout origin/main -- .github/scripts/merge-release-sha256sums.sh
          chmod +x .github/scripts/merge-release-sha256sums.sh

      - name: Build merged SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash .github/scripts/merge-release-sha256sums.sh "${RELEASE_VERSION}"

      - name: Upload SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "${RELEASE_TAG}" --json assets --jq '.assets[].name' | grep -qx SHA256SUMS; then
            gh release delete-asset "${RELEASE_TAG}" SHA256SUMS -y
          fi
          gh release upload "${RELEASE_TAG}" release-artifacts-merge/SHA256SUMS

  smoke-test-deb:
    name: Install .deb (${{ matrix.arch }})
    needs: merge-sha256sums
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            deb_pattern: cdt_${{ inputs.version }}_amd64.deb
          - arch: arm64
            runner: ubuntu-24.04-arm
            deb_pattern: cdt_${{ inputs.version }}_arm64.deb
    env:
      RELEASE_TAG: cdt-v${{ inputs.version }}
    steps:
      - name: Checkout (for gh)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download production .deb from release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "${RELEASE_TAG}" \
            -p "${{ matrix.deb_pattern }}" \
            -D /tmp/deb-test

      - name: Install and verify
        run: |
          set -euo pipefail
          deb="/tmp/deb-test/${{ matrix.deb_pattern }}"
          sudo dpkg -i "${deb}" || sudo apt-get -f install -y
          test -x /usr/bin/cdt
          test -x /usr/bin/delve
          cdt version
          delve --help >/dev/null
          dpkg -s cdt | grep -q '^Status: install ok installed'

  smoke-test-rpm:
    name: Install .rpm (${{ matrix.arch }})
    needs: merge-sha256sums
    runs-on: ${{ matrix.runner }}
    container: fedora:41
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            rpm_pattern: cdt-${{ inputs.version }}-1.x86_64.rpm
          - arch: arm64
            runner: ubuntu-24.04-arm
            rpm_pattern: cdt-${{ inputs.version }}-1.aarch64.rpm
    env:
      RELEASE_TAG: cdt-v${{ inputs.version }}
    steps:
      - name: Install tooling
        run: dnf install -y gh tar

      - name: Download production .rpm from release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release download "${RELEASE_TAG}" \
            -p "${{ matrix.rpm_pattern }}" \
            -D /tmp/rpm-test

      - name: Install and verify
        run: |
          set -euo pipefail
          rpm -ivh "/tmp/rpm-test/${{ matrix.rpm_pattern }}"
          test -x /usr/bin/cdt
          test -x /usr/bin/delve
          cdt version
          delve --help >/dev/null
          rpm -q cdt
