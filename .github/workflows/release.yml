# Compute the next release version on merge to main, bump Cargo workspace version,
# and create a GitHub Release. Release artifacts and docs deploy are not wired yet.
#
# First release: no tags/releases → current 0.0.0 + default minor bump → 0.1.0.
# PR bump directives: a line containing only #major, #minor, or #patch (case-insensitive).

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_version:
        description: >-
          Publish this version (e.g. 0.1.0). Use when main already has the Cargo bump
          but the GitHub release failed. Leave empty to compute from tags and PR bump rules.
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Version and release
    runs-on: ubuntu-latest
    env:
      RELEASE_BRANCH: ${{ github.ref_name }}
    if: >-
      github.event_name == 'workflow_dispatch' ||
      !startsWith(github.event.head_commit.message, 'chore: release ')
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Resolve merged pull request body
        if: github.event_name != 'workflow_dispatch'
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/resolve-pr-body.sh "${{ github.event.head_commit.message }}"

      - name: Use manual release version
        if: github.event_name == 'workflow_dispatch' && inputs.release_version != ''
        id: manual_version
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          ver="${RELEASE_VERSION#v}"
          if [[ ! "$ver" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::release_version must be MAJOR.MINOR.PATCH (got: ${RELEASE_VERSION})"
            exit 1
          fi
          echo "next_version=${ver}" >>"$GITHUB_OUTPUT"

      - name: Compute next version
        id: version
        if: steps.manual_version.outputs.next_version == ''
        uses: ./.github/actions/version-bump
        with:
          pr_body: ${{ steps.pr.outputs.body || '' }}
          default_bump: minor

      - name: Select release version
        id: release_version
        run: |
          set -euo pipefail
          if [[ -n "${{ steps.manual_version.outputs.next_version }}" ]]; then
            echo "next_version=${{ steps.manual_version.outputs.next_version }}" >>"$GITHUB_OUTPUT"
          else
            echo "next_version=${{ steps.version.outputs.next_version }}" >>"$GITHUB_OUTPUT"
          fi

      - name: Validate version bump
        if: steps.version.outputs.error != ''
        run: |
          echo "::error::Release version bump failed (${{ steps.version.outputs.error }})"
          exit 1

      - name: Skip if release already exists
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT_VERSION: ${{ steps.release_version.outputs.next_version }}
        run: |
          set -euo pipefail
          if gh release view "$NEXT_VERSION" >/dev/null 2>&1; then
            echo "skip=true" >>"$GITHUB_OUTPUT"
            echo "Release ${NEXT_VERSION} already exists; skipping."
          else
            echo "skip=false" >>"$GITHUB_OUTPUT"
          fi

      - name: Install Rust toolchain
        if: steps.exists.outputs.skip != 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Bump Cargo.toml workspace version and resync Cargo.lock
        if: steps.exists.outputs.skip != 'true'
        env:
          NEXT_VERSION: ${{ steps.release_version.outputs.next_version }}
        run: bash .github/scripts/bump-cargo-versions.sh

      - name: Commit release preparation
        if: steps.exists.outputs.skip != 'true'
        id: commit
        env:
          NEXT_VERSION: ${{ steps.release_version.outputs.next_version }}
          GH_TOKEN: ${{ secrets.RELEASE_PUSH_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN}" ]]; then
            echo "::error::RELEASE_PUSH_TOKEN secret is not configured (admin PAT for release bump PR)."
            exit 1
          fi

          git add Cargo.toml Cargo.lock
          if git diff --cached --quiet; then
            echo "committed=false" >>"$GITHUB_OUTPUT"
            echo "Release preparation already on ${RELEASE_BRANCH} for ${NEXT_VERSION}; skipping commit."
            exit 0
          fi

          release_branch="chore/release-${NEXT_VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: release ${NEXT_VERSION}"
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${release_branch}" 2>/dev/null || true
          git push --force-with-lease \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:"${release_branch}"

          pr_number="$(gh pr list --head "${release_branch}" --base "${RELEASE_BRANCH}" --state open --json number --jq '.[0].number // empty')"
          if [[ -z "${pr_number}" ]]; then
            gh pr create --base "${RELEASE_BRANCH}" --head "${release_branch}" \
              --title "chore: release ${NEXT_VERSION}" \
              --body "Automated workspace version bump for ${NEXT_VERSION}."
            pr_number="$(gh pr view "${release_branch}" --json number --jq .number)"
          fi
          gh pr merge "${pr_number}" --rebase --admin --delete-branch
          echo "committed=true" >>"$GITHUB_OUTPUT"

      - name: Verify release preparation on release branch
        if: steps.exists.outputs.skip != 'true'
        env:
          NEXT_VERSION: ${{ steps.release_version.outputs.next_version }}
        run: |
          set -euo pipefail
          git fetch origin "${RELEASE_BRANCH}"
          cargo_ver="$(git show "origin/${RELEASE_BRANCH}:Cargo.toml" | awk '
            /^\[workspace\.package\]/ { in_pkg=1; next }
            /^\[/ { in_pkg=0 }
            in_pkg && /^version = / && ver == "" {
              val=$3
              gsub(/"/, "", val)
              ver=val
            }
            END { print ver }
          ')"
          if [[ "${cargo_ver}" != "${NEXT_VERSION}" ]]; then
            echo "::error::Cargo.toml on ${RELEASE_BRANCH} is ${cargo_ver:-unknown}; expected ${NEXT_VERSION}"
            exit 1
          fi
          lock_ver="$(git show "origin/${RELEASE_BRANCH}:Cargo.lock" | awk '
            /^name = "dns-core"$/ { want=1; next }
            want && /^version = / && ver == "" {
              val=$3
              gsub(/"/, "", val)
              ver=val
            }
            END { print ver }
          ')"
          if [[ "${lock_ver}" != "${NEXT_VERSION}" ]]; then
            echo "::error::Cargo.lock on ${RELEASE_BRANCH} pins dns-core ${lock_ver:-unknown}; expected ${NEXT_VERSION}"
            exit 1
          fi
          if git rev-parse "refs/tags/${NEXT_VERSION}" >/dev/null 2>&1; then
            echo "::error::Tag ${NEXT_VERSION} already exists locally; refusing to create release"
            exit 1
          fi
          echo "Verified Cargo.toml and Cargo.lock ${NEXT_VERSION} on origin/${RELEASE_BRANCH}."

      - name: Create GitHub Release
        if: steps.exists.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT_VERSION: ${{ steps.release_version.outputs.next_version }}
        run: |
          set -euo pipefail
          git fetch origin "${RELEASE_BRANCH}"
          if gh release view "$NEXT_VERSION" >/dev/null 2>&1; then
            echo "::error::Release ${NEXT_VERSION} already exists"
            exit 1
          fi
          gh release create "$NEXT_VERSION" \
            --target "${RELEASE_BRANCH}" \
            --title "$NEXT_VERSION" \
            --generate-notes

          # Future: dispatch docs-deploy and build-release-artifacts workflows here.
