# Compute the next CDT bundle version on merge to main, bump cdt-manifest.toml and
# component crate versions, create a GitHub Release tagged cdt-vX.Y.Z, and build assets.
#
# First release: bundle 0.0.0 + default minor bump → 0.1.0.
# PR directives:
#   - Bundle: #cdt:minor or shorthand #minor (default: minor)
#   - Utility: #delve:patch, #delve:minor, etc.
# Utilities with changes under crates/<utility>/ auto-receive a patch bump.
#
# prepare: version bump + chore/release PR (waits for CI before merge)
# publish: GitHub release creation (also runs after manual chore/release merges)
# artifacts: deb/rpm/tarballs/SBOM upload via reusable workflow

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_version:
        description: >-
          Publish this bundle version (e.g. 0.3.0). Use when main already has the
          version bump but the GitHub release failed. Leave empty to compute from tags
          and PR bump rules.
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release version
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'push' &&
        !startsWith(github.event.head_commit.message, 'chore: release ')) ||
      (github.event_name == 'workflow_dispatch' && inputs.release_version == '')
    env:
      RELEASE_BRANCH: ${{ github.ref_name }}
    outputs:
      version: ${{ steps.release_version.outputs.next_bundle_version }}
      skip_publish: ${{ steps.exists.outputs.skip }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install tomli

      - name: Detect unpublished manifest version
        id: pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current="$(python3 -c 'import tomllib, pathlib; print(tomllib.loads(pathlib.Path("cdt-manifest.toml").read_text())["bundle"]["version"])')"
          tag="cdt-v${current}"
          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "has_pending=false" >>"$GITHUB_OUTPUT"
            echo "No pending release; manifest ${current} is already published as ${tag}."
          else
            echo "has_pending=true" >>"$GITHUB_OUTPUT"
            echo "version=${current}" >>"$GITHUB_OUTPUT"
            echo "Manifest ${current} is not published yet; will release ${tag} before bumping."
          fi

      - name: Resolve merged pull request body
        if: steps.pending.outputs.has_pending != 'true'
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/resolve-pr-body.sh "${{ github.event.head_commit.message }}"

      - name: Collect changed files
        if: steps.pending.outputs.has_pending != 'true'
        id: changes
        run: |
          set -euo pipefail
          git diff --name-only HEAD~1 HEAD > changed-files.txt || true
          {
            echo "files<<EOF"
            cat changed-files.txt
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Compute next version
        if: steps.pending.outputs.has_pending != 'true'
        id: version
        uses: ./.github/actions/version-bump
        with:
          pr_body: ${{ steps.pr.outputs.body || '' }}
          default_bump: minor
          changed_files: ${{ steps.changes.outputs.files }}

      - name: Select release version
        id: release_version
        env:
          PR_BODY: ${{ steps.pr.outputs.body || '' }}
        run: |
          set -euo pipefail
          if [[ "${{ steps.pending.outputs.has_pending }}" == "true" ]]; then
            echo "next_bundle_version=${{ steps.pending.outputs.version }}" >>"$GITHUB_OUTPUT"
            python3 .github/scripts/cdt-versions.py component-versions-json >.release-component-versions.json
            exit 0
          fi
          echo "next_bundle_version=${{ steps.version.outputs.next_bundle_version }}" >>"$GITHUB_OUTPUT"
          python3 .github/scripts/cdt-versions.py preview \
            --pr-body "${PR_BODY}" \
            --changed-files "$(cat changed-files.txt)" \
            --format json \
            | python3 -c 'import json,sys; json.dump(json.load(sys.stdin)["component_versions"], open(".release-component-versions.json","w"), separators=(",",":"))'

      - name: Validate version bump
        if: steps.pending.outputs.has_pending != 'true' && steps.version.outputs.error != ''
        run: |
          echo "::error::Release version bump failed (${{ steps.version.outputs.error }})"
          exit 1

      - name: Skip if release already exists
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT_VERSION: ${{ steps.release_version.outputs.next_bundle_version }}
        run: |
          set -euo pipefail
          tag="cdt-v${NEXT_VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "skip=true" >>"$GITHUB_OUTPUT"
            echo "Release ${tag} already exists; skipping."
          else
            echo "skip=false" >>"$GITHUB_OUTPUT"
          fi

      - name: Install Rust toolchain
        if: steps.exists.outputs.skip != 'true' && steps.pending.outputs.has_pending != 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Bump manifest and crate versions
        if: steps.exists.outputs.skip != 'true' && steps.pending.outputs.has_pending != 'true'
        env:
          BUNDLE_VERSION: ${{ steps.release_version.outputs.next_bundle_version }}
          COMPONENT_VERSIONS_FILE: .release-component-versions.json
        run: bash .github/scripts/bump-cdt-versions.sh

      - name: Commit release preparation
        if: steps.exists.outputs.skip != 'true' && steps.pending.outputs.has_pending != 'true'
        id: commit
        env:
          NEXT_VERSION: ${{ steps.release_version.outputs.next_bundle_version }}
          GH_TOKEN: ${{ secrets.RELEASE_PUSH_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN}" ]]; then
            echo "::error::RELEASE_PUSH_TOKEN secret is not configured (admin PAT for release bump PR)."
            exit 1
          fi

          git add cdt-manifest.toml Cargo.toml Cargo.lock crates/
          if git diff --cached --quiet; then
            echo "committed=false" >>"$GITHUB_OUTPUT"
            echo "Release preparation already on ${RELEASE_BRANCH} for ${NEXT_VERSION}; skipping commit."
            exit 0
          fi

          release_branch="chore/release-${NEXT_VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: release cdt ${NEXT_VERSION}"
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${release_branch}" 2>/dev/null || true
          git push --force-with-lease \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:"${release_branch}"

          pr_number="$(gh pr list --head "${release_branch}" --base "${RELEASE_BRANCH}" --state open --json number --jq '.[0].number // empty')"
          if [[ -z "${pr_number}" ]]; then
            gh pr create --base "${RELEASE_BRANCH}" --head "${release_branch}" \
              --title "chore: release cdt ${NEXT_VERSION}" \
              --body "Automated CDT bundle version bump for ${NEXT_VERSION}."
            pr_number="$(gh pr view "${release_branch}" --json number --jq .number)"
          fi

          bash .github/scripts/wait-and-merge-release-pr.sh "${pr_number}"
          echo "committed=true" >>"$GITHUB_OUTPUT"

      - name: Verify release preparation on release branch
        if: steps.exists.outputs.skip != 'true'
        env:
          NEXT_VERSION: ${{ steps.release_version.outputs.next_bundle_version }}
        run: |
          set -euo pipefail
          git fetch origin "${RELEASE_BRANCH}"
          manifest_ver="$(git show "origin/${RELEASE_BRANCH}:cdt-manifest.toml" | awk '
            /^\[bundle\]/ { in_bundle=1; next }
            /^\[/ { in_bundle=0 }
            in_bundle && /^version = / {
              val=$3
              gsub(/"/, "", val)
              print val
              exit
            }
          ')"
          if [[ "${manifest_ver}" != "${NEXT_VERSION}" ]]; then
            echo "::error::cdt-manifest.toml on ${RELEASE_BRANCH} is ${manifest_ver:-unknown}; expected ${NEXT_VERSION}"
            exit 1
          fi
          tag="cdt-v${NEXT_VERSION}"
          if git rev-parse "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "::error::Tag ${tag} already exists locally; refusing to continue"
            exit 1
          fi
          echo "Verified cdt-manifest.toml ${NEXT_VERSION} on origin/${RELEASE_BRANCH}."

  publish:
    name: Create GitHub release
    needs: prepare
    runs-on: ubuntu-latest
    if: >-
      always() && (
        (needs.prepare.result == 'success' && needs.prepare.outputs.skip_publish != 'true') ||
        (needs.prepare.result == 'skipped' &&
          github.event_name == 'push' &&
          startsWith(github.event.head_commit.message, 'chore: release ')) ||
        (github.event_name == 'workflow_dispatch' && inputs.release_version != '')
      )
    env:
      RELEASE_BRANCH: ${{ github.ref_name }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install tomli

      - name: Resolve publish version
        id: version
        env:
          PREPARE_VERSION: ${{ needs.prepare.outputs.version }}
          MANUAL_VERSION: ${{ inputs.release_version }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: bash .github/scripts/resolve-publish-version.sh

      - name: Skip if release already exists
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          tag="cdt-v${NEXT_VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "skip=true" >>"$GITHUB_OUTPUT"
            echo "Release ${tag} already exists; skipping create."
          else
            echo "skip=false" >>"$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        if: steps.exists.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/publish-cdt-release.sh "${{ steps.version.outputs.version }}"

  artifacts:
    name: Build release artifacts
    needs: publish
    if: needs.publish.result == 'success' && needs.publish.outputs.version != ''
    uses: ./.github/workflows/build-release-artifacts.yml
    with:
      version: ${{ needs.publish.outputs.version }}
    secrets: inherit
