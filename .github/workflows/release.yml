# Compute the next CDT bundle version on merge to main, bump cdt-manifest.toml and
# component crate versions, and create a GitHub Release tagged cdt-vX.Y.Z.
#
# First release: bundle 0.0.0 + default minor bump → 0.1.0.
# PR directives:
#   - Bundle: #cdt:minor or shorthand #minor (default: minor)
#   - Utility: #delve:patch, #delve:minor, etc.
# Utilities with changes under crates/<utility>/ auto-receive a patch bump.

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_version:
        description: >-
          Publish this bundle version (e.g. 0.1.0). Use when main already has the
          version bump but the GitHub release failed. Leave empty to compute from tags
          and PR bump rules.
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Version and release
    runs-on: ubuntu-latest
    env:
      RELEASE_BRANCH: ${{ github.ref_name }}
    if: >-
      github.event_name == 'workflow_dispatch' ||
      !startsWith(github.event.head_commit.message, 'chore: release ')
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install tomli

      - name: Resolve merged pull request body
        if: github.event_name != 'workflow_dispatch'
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/resolve-pr-body.sh "${{ github.event.head_commit.message }}"

      - name: Collect changed files
        id: changes
        run: |
          set -euo pipefail
          git diff --name-only HEAD~1 HEAD > changed-files.txt || true
          {
            echo "files<<EOF"
            cat changed-files.txt
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Use manual release version
        if: github.event_name == 'workflow_dispatch' && inputs.release_version != ''
        id: manual_version
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          ver="${RELEASE_VERSION#v}"
          ver="${ver#cdt-v}"
          if [[ ! "$ver" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::release_version must be MAJOR.MINOR.PATCH (got: ${RELEASE_VERSION})"
            exit 1
          fi
          echo "next_bundle_version=${ver}" >>"$GITHUB_OUTPUT"

      - name: Compute next version
        id: version
        if: steps.manual_version.outputs.next_bundle_version == ''
        uses: ./.github/actions/version-bump
        with:
          pr_body: ${{ steps.pr.outputs.body || '' }}
          default_bump: minor
          changed_files: ${{ steps.changes.outputs.files }}

      - name: Select release version
        id: release_version
        env:
          PR_BODY: ${{ steps.pr.outputs.body || '' }}
          MANUAL_VERSION: ${{ steps.manual_version.outputs.next_bundle_version }}
        run: |
          set -euo pipefail
          if [[ -n "${MANUAL_VERSION}" ]]; then
            echo "next_bundle_version=${MANUAL_VERSION}" >>"$GITHUB_OUTPUT"
            python3 .github/scripts/cdt-versions.py component-versions-json >.release-component-versions.json
          else
            echo "next_bundle_version=${{ steps.version.outputs.next_bundle_version }}" >>"$GITHUB_OUTPUT"
            python3 .github/scripts/cdt-versions.py preview \
              --pr-body "${PR_BODY}" \
              --changed-files "$(cat changed-files.txt)" \
              --format json \
              | python3 -c 'import json,sys; json.dump(json.load(sys.stdin)["component_versions"], open(".release-component-versions.json","w"), separators=(",",":"))'
          fi

      - name: Validate version bump
        if: steps.version.outputs.error != ''
        run: |
          echo "::error::Release version bump failed (${{ steps.version.outputs.error }})"
          exit 1

      - name: Skip if release already exists
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT_VERSION: ${{ steps.release_version.outputs.next_bundle_version }}
        run: |
          set -euo pipefail
          tag="cdt-v${NEXT_VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "skip=true" >>"$GITHUB_OUTPUT"
            echo "Release ${tag} already exists; skipping."
          else
            echo "skip=false" >>"$GITHUB_OUTPUT"
          fi

      - name: Install Rust toolchain
        if: steps.exists.outputs.skip != 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Bump manifest and crate versions
        if: steps.exists.outputs.skip != 'true'
        env:
          BUNDLE_VERSION: ${{ steps.release_version.outputs.next_bundle_version }}
          COMPONENT_VERSIONS_FILE: .release-component-versions.json
        run: bash .github/scripts/bump-cdt-versions.sh

      - name: Commit release preparation
        if: steps.exists.outputs.skip != 'true'
        id: commit
        env:
          NEXT_VERSION: ${{ steps.release_version.outputs.next_bundle_version }}
          GH_TOKEN: ${{ secrets.RELEASE_PUSH_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN}" ]]; then
            echo "::error::RELEASE_PUSH_TOKEN secret is not configured (admin PAT for release bump PR)."
            exit 1
          fi

          git add cdt-manifest.toml Cargo.toml Cargo.lock crates/
          if git diff --cached --quiet; then
            echo "committed=false" >>"$GITHUB_OUTPUT"
            echo "Release preparation already on ${RELEASE_BRANCH} for ${NEXT_VERSION}; skipping commit."
            exit 0
          fi

          release_branch="chore/release-${NEXT_VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: release cdt ${NEXT_VERSION}"
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${release_branch}" 2>/dev/null || true
          git push --force-with-lease \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:"${release_branch}"

          pr_number="$(gh pr list --head "${release_branch}" --base "${RELEASE_BRANCH}" --state open --json number --jq '.[0].number // empty')"
          if [[ -z "${pr_number}" ]]; then
            gh pr create --base "${RELEASE_BRANCH}" --head "${release_branch}" \
              --title "chore: release cdt ${NEXT_VERSION}" \
              --body "Automated CDT bundle version bump for ${NEXT_VERSION}."
            pr_number="$(gh pr view "${release_branch}" --json number --jq .number)"
          fi
          gh pr merge "${pr_number}" --rebase --admin --delete-branch
          echo "committed=true" >>"$GITHUB_OUTPUT"

      - name: Verify release preparation on release branch
        if: steps.exists.outputs.skip != 'true'
        env:
          NEXT_VERSION: ${{ steps.release_version.outputs.next_bundle_version }}
        run: |
          set -euo pipefail
          git fetch origin "${RELEASE_BRANCH}"
          manifest_ver="$(git show "origin/${RELEASE_BRANCH}:cdt-manifest.toml" | awk '
            /^\[bundle\]/ { in_bundle=1; next }
            /^\[/ { in_bundle=0 }
            in_bundle && /^version = / {
              val=$3
              gsub(/"/, "", val)
              print val
              exit
            }
          ')"
          if [[ "${manifest_ver}" != "${NEXT_VERSION}" ]]; then
            echo "::error::cdt-manifest.toml on ${RELEASE_BRANCH} is ${manifest_ver:-unknown}; expected ${NEXT_VERSION}"
            exit 1
          fi
          tag="cdt-v${NEXT_VERSION}"
          if git rev-parse "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "::error::Tag ${tag} already exists locally; refusing to create release"
            exit 1
          fi
          echo "Verified cdt-manifest.toml ${NEXT_VERSION} on origin/${RELEASE_BRANCH}."

      - name: Create GitHub Release
        if: steps.exists.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT_VERSION: ${{ steps.release_version.outputs.next_bundle_version }}
        run: |
          set -euo pipefail
          git fetch origin "${RELEASE_BRANCH}"
          tag="cdt-v${NEXT_VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::Release ${tag} already exists"
            exit 1
          fi

          notes_file="$(mktemp)"
          python3 .github/scripts/cdt-versions.py release-notes \
            --version "${NEXT_VERSION}" \
            --component-versions "$(cat .release-component-versions.json)" >"$notes_file"

          gh release create "$tag" \
            --target "${RELEASE_BRANCH}" \
            --title "cdt ${NEXT_VERSION}" \
            --notes-file "$notes_file"
          rm -f "$notes_file"

      - name: Trigger release artifacts build
        if: steps.exists.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT_VERSION: ${{ steps.release_version.outputs.next_bundle_version }}
        run: |
          set -euo pipefail
          gh workflow run build-release-artifacts.yml \
            --ref "cdt-v${NEXT_VERSION}" \
            -f "version=${NEXT_VERSION}"
          echo "Dispatched release artifacts build for cdt-v${NEXT_VERSION}."
